<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>OG image source</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif; color: #eef0f5; background: #0b0d14;
      display: flex; align-items: center; padding: 0 88px; box-sizing: border-box; gap: 72px;
    }
    .copy { flex: 1; }
    .status { display: flex; align-items: center; gap: 14px; font-size: 24px; color: #a3a9b8; }
    .led { width: 12px; height: 12px; border-radius: 50%; background: #4cc38a; box-shadow: 0 0 0 5px rgba(76,195,138,.18); }
    h1 { font-size: 88px; line-height: 1; margin: 32px 0 0; font-weight: 500; letter-spacing: -.03em; }
    .role { font-size: 34px; color: #a3a9b8; margin-top: 18px; }
    .meta { margin-top: 48px; padding-top: 24px; border-top: 1px solid rgba(238,240,245,.14); font-family: "IBM Plex Mono", monospace; font-size: 22px; color: #7a8296; }
    img { width: 340px; height: 340px; flex-shrink: 0; object-fit: cover; border-radius: 50%; outline: 1px solid rgba(238,240,245,.18); outline-offset: 10px; }
  </style>
</head>
<body>
  <img src="assets/img/avatar.jpg" alt="">
  <div class="copy">
    <div class="status"><span class="led"></span>Open to freelance &amp; contract work</div>
    <h1>Keval Devani</h1>
    <div class="role">Senior Flutter &amp; Mobile IoT Engineer</div>
    <div class="meta">BLE · OTA · MQTT · AWS IoT · ThingsBoard</div>
  </div>
</body>
</html>
